<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg-grad-tan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="128" cy="128" r="120" fill="url(#bg-grad-tan)" stroke="#0f386b" stroke-width="6"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Body / Floral Blouse -->
  <path d="M 52 230 C 52 180, 80 160, 128 160 C 176 160, 204 180, 204 230 Z" fill="#0f386b"/>
  <!-- Blouse Collar & Patterns -->
  <path d="M 98 162 L 128 190 L 158 162" fill="none" stroke="#fdfbf7" stroke-width="4"/>
  <circle cx="90" cy="195" r="4" fill="#f59e0b"/>
  <circle cx="166" cy="195" r="4" fill="#f59e0b"/>
  <circle cx="128" cy="210" r="5" fill="#c23b22"/>

  <!-- Neck -->
  <rect x="114" y="135" width="28" height="30" rx="8" fill="#fbd38d"/>

  <!-- Head -->
