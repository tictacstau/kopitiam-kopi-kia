  <!-- Silver Hair & Bun -->
  <circle cx="128" cy="46" r="22" fill="#cbd5e1" stroke="#0f386b" stroke-width="3"/>
  <path d="M 84 95 C 80 60, 100 48, 128 48 C 156 48, 176 60, 172 95 C 160 62, 140 56, 128 56 C 116 56, 96 62, 84 95 Z" fill="#94a3b8" stroke="#0f386b" stroke-width="3"/>

  <!-- Ears & Earrings -->
  <circle cx="84" cy="102" r="8" fill="#fbd38d" stroke="#0f386b" stroke-width="2"/>
  <circle cx="172" cy="102" r="8" fill="#fbd38d" stroke="#0f386b" stroke-width="2"/>
  <circle cx="84" cy="112" r="4" fill="#f59e0b"/>
  <circle cx="172" cy="112" r="4" fill="#f59e0b"/>

  <!-- Eyes & Gentle Wrinkles -->
  <path d="M 104 96 Q 112 90 120 96" fill="none" stroke="#0f386b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 136 96 Q 144 90 152 96" fill="none" stroke="#0f386b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 98 94 Q 102 98 98 102" fill="none" stroke="#d97706" stroke-width="2"/>
  <path d="M 158 94 Q 154 98 158 102" fill="none" stroke="#d97706" stroke-width="2"/>

  <!-- Eyebrows -->
  <path d="M 102 85 Q 112 80 120 86" fill="none" stroke="#64748b" stroke-width="3.5"/>
  <path d="M 136 86 Q 144 80 154 85" fill="none" stroke="#64748b" stroke-width="3.5"/>

  <!-- Reading Glasses -->
  <rect x="98" y="88" width="24" height="18" rx="5" fill="rgba(255,255,255,0.4)" stroke="#c23b22" stroke-width="3"/>
  <rect x="134" y="88" width="24" height="18" rx="5" fill="rgba(255,255,255,0.4)" stroke="#c23b22" stroke-width="3"/>
  <line x1="122" y1="94" x2="134" y2="94" stroke="#c23b22" stroke-width="3"/>
  <!-- Glasses Chain -->
  <path d="M 98 96 C 88 120, 92 140, 110 160" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M 158 96 C 168 120, 164 140, 146 160" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Nose -->
  <path d="M 128 98 L 124 112 L 132 112" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

  <!-- Gentle Grandmother Smile -->
  <path d="M 112 124 Q 128 138 144 124" fill="none" stroke="#c23b22" stroke-width="4" stroke-linecap="round"/>
</svg>
